name: Research companion site
on:
  workflow_call:
    inputs:
      build-argv:
        type: string
        default: '["python3", ".agent/shared/tools/research_project.py", "site"]'
      deploy:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build site using an argv list
        env:
          BUILD_ARGV: ${{ inputs.build-argv }}
        run: python -c 'import json,os,subprocess; subprocess.run(json.loads(os.environ["BUILD_ARGV"]),check=True)'
      - run: python .agent/shared/tools/research_project.py links .agent-runtime/site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: .agent-runtime/site
  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
